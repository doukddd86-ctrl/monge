<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#bfe1f3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="몬스터 단어장"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>몬스터 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf4fa;--txt:#1b2a33;--shell:#bfe1f3;--edge:#8db8d3;--scr:#d6dbca;--ink:#1f2622;--key:#f6f3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--txt:#d7e6ef;--shell:#2d4b5f;--edge:#1c3342;--scr:#bcc3b0}}
:root[data-theme="dark"]{--bg:#0f1a22;--txt:#d7e6ef;--shell:#2d4b5f;--edge:#1c3342;--scr:#bcc3b0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Gowun Dodum',system-ui,sans-serif;min-height:100vh;padding:16px}
main{max-width:360px;margin:0 auto}
.dev{background:var(--shell);border:3px solid var(--edge);border-radius:28px 28px 40px 40px;padding:18px 18px 22px;box-shadow:0 6px 0 var(--edge)}
.scr{background:var(--scr);color:var(--ink);border:3px solid var(--edge);border-radius:12px;min-height:310px;padding:12px;display:flex;flex-direction:column;font-family:'DotGothic16','Gowun Dodum',monospace}
.top{display:flex;gap:10px;align-items:center}
#pet{width:64px;flex:none}
.st{flex:1;font-size:15px}
.bar{height:6px;border:2px solid var(--ink);margin-top:4px}
#xp{height:100%;background:var(--ink);width:0}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:8px 0}
#w{font-size:34px;word-break:break-word}
#m{font-size:21px;font-family:'Gowun Dodum','DotGothic16',sans-serif;min-height:56px}
.sp{background:none;border:2px solid var(--ink);color:var(--ink);border-radius:8px;padding:2px 10px;font:inherit;font-size:14px;cursor:pointer}
.info{font-size:13px}
.keys{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:16px}
.keys button{background:var(--key);color:var(--ink);border:3px solid var(--edge);border-radius:16px;padding:14px 4px;font:inherit;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--edge)}
.keys button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--txt);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:18px 0 10px}
.tabs button{flex:1;background:none;color:var(--txt);border:2px solid var(--edge);border-radius:12px;padding:8px 2px;font:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--edge);color:#fff}
section p{font-size:14px;line-height:1.5;margin:0 0 8px}
textarea{width:100%;height:220px;background:var(--key);color:var(--ink);border:3px solid var(--edge);border-radius:12px;padding:10px;font:inherit;font-size:16px}
.row{display:flex;gap:8px;margin-top:8px}
.row button,.ev button{flex:1;background:var(--key);color:var(--ink);border:3px solid var(--edge);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
.ev{display:flex;gap:8px;margin-top:10px}
.ev button svg{width:56px;display:block;margin:0 auto 4px}
#big{width:160px;margin:0 auto 6px}
#pn{text-align:center;font-size:20px;margin-bottom:10px}
.ml{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.ml b{width:34px;font-weight:400}
.m{flex:1;height:12px;border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.m i{display:block;height:100%;background:var(--txt);width:0}
#say,#msg,#dn{font-size:14px;min-height:20px;margin-top:6px}
#dg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.c{aspect-ratio:1;border:2px solid var(--edge);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;padding:2px;opacity:.9}
.c svg{width:100%}
#gm{margin-top:14px;font-size:14px;text-align:center}#gm button,.ch button{background:var(--key);color:var(--ink);border:3px solid var(--edge);border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer}#gm button{margin-top:6px}#gq{font-size:22px;text-align:center;margin:12px 0}.ch{display:grid;gap:8px}.ch button{font-size:18px}.ch .ok{background:var(--edge);color:#fff}.ch .no{opacity:.4}
.mu{background:none;border:2px solid var(--edge);color:var(--txt);border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
#fx{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fl .6s}#fx[hidden]{display:none}#fxs{width:230px;animation:gr 1.4s}#fxt{font-size:24px;text-align:center;animation:fi 1.4s}
@keyframes fl{0%{background:#fff}100%{background:var(--bg)}}@keyframes gr{0%{transform:scale(.2) rotate(-20deg);filter:brightness(6)}60%{transform:scale(1.2)}100%{transform:scale(1);filter:none}}@keyframes fi{0%,40%{opacity:0}100%{opacity:1}}
.bb{animation:bob 2.6s ease-in-out infinite}.gl{filter:drop-shadow(0 0 3px var(--gl))}.bb.g7{animation:bob 2.6s ease-in-out infinite,pulse 2s ease-in-out infinite}
.c svg.bb,.ev svg.bb{animation:none}.c.lk svg.bb{filter:brightness(0);opacity:.2}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes pulse{50%{filter:drop-shadow(0 0 10px var(--gl))}}
.k4{grid-auto-flow:row;grid-template-columns:1fr 1fr}.keys.k4 button{font-size:15px;padding:12px 4px;word-break:keep-all}.keys .ok{background:var(--edge);color:#fff}.keys .no{opacity:.4}
.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><main>
<div class="dev">
  <div class="scr">
    <div class="top"><div id="pet"></div>
      <div class="st"><span id="hp"></span> <span id="lv"></span><div class="bar"><div id="xp"></div></div></div></div>
    <div class="card"><div id="w"></div><div id="m"></div><button class="sp" id="sp" hidden>발음 듣기</button><div class="info" id="info"></div></div>
  </div>
  <div class="keys" id="keys"></div>
</div>
<div style="text-align:right;margin-top:10px"><button id="mu" class="mu"></button></div>
<div id="gm"></div>
<section id="pg" hidden><p id="gh"></p><div id="gq"></div><div class="ch" id="gc"></div><div id="gr" role="status"></div></section>
<div class="tabs"><button id="t1" aria-pressed="true">학습</button><button id="t2" aria-pressed="false">펫</button><button id="t3" aria-pressed="false">도감</button><button id="t4" aria-pressed="false">단어장</button></div>
<section id="p2" hidden>
  <div id="big"></div><div id="pn"></div>
  <div class="ml"><b>밥</b><div class="m"><i id="f"></i></div></div>
  <div class="ml"><b>놀이</b><div class="m"><i id="u"></i></div></div>
  <p id="ck"></p>
  <div class="row"><button id="fd">밥주기 (쿠키 1개)</button><button id="pl">놀아주기</button></div>
  <div id="say" role="status"></div>
  <p>밥과 놀이가 둘 다 절반 이상이고 하트가 있으면 경험치를 2배로 받아요. 놀면 배가 고파지니 쿠키로 밥을 챙겨 주세요. 쿠키는 퀴즈를 맞힐 때마다 1개씩 생겨요.</p>
  <div class="ev" id="evo"></div>
</section>
<section id="p3" hidden>
  <p id="dc"></p><div id="dn" role="status"></div><div id="dg"></div>
</section>
<section id="p4" hidden>
  <p>한 줄에 하나씩 "단어, 뜻" 형식으로 적으세요. 저장해도 기존 단어의 학습 진도는 유지돼요.</p>
  <textarea id="ta" spellcheck="false"></textarea>
  <div class="row"><button id="sv">저장</button><button id="rs">진도 초기화</button></div>
  <p>기기를 바꾸거나 앱을 지우면 진도가 사라질 수 있어요. 가끔 백업 파일을 저장해 두세요.</p>
  <div class="row"><button id="ex">백업 저장</button><button id="im">백업 불러오기</button></div><input type="file" id="fi" accept=".json,application/json" hidden>
  <div id="msg" role="status"></div>
</section>
</main>
<div id="fx" hidden role="status"><div id="fxs"></div><div id="fxt"></div></div>
